[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "TerminalVideoPlayer"
version = "1.2.1"
description = "A TUI video player."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

dependencies = [
    "numpy",
    "decord",
    "sounddevice",
    "colorama",
    "opencv-python"
]

[project.scripts]
terminal-video-player = "TerminalVideoPlayer.main:run"

[project.urls]
Homepage = "https://github.com/Stu67nt/TerminalVideoPlayer"

